<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ecobin Waste — Admin</title>
<style>
  :root{ --ink:#173319; --paper:#FFFFFF; --paper-2:#EFFAEA; --green:#3FA34D; --green-dark:#256029; --line:rgba(23,51,25,0.15); }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI',Arial,sans-serif; background:var(--paper-2); color:var(--ink); }
  .wrap{max-width:1200px; margin:0 auto; padding:24px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;}
  h1{font-size:22px; margin:0;}
  .gate{max-width:380px; margin:80px auto; background:#fff; border-radius:12px; padding:28px; box-shadow:0 8px 24px rgba(0,0,0,0.08); width:calc(100% - 32px);}
  .gate input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; margin:10px 0;}
  .gate button, .btn{background:var(--green-dark); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer; font-size:13.5px;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .toolbar button{background:#fff; border:1px solid var(--line); padding:8px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; font-weight:600;}
  .toolbar button.active{background:var(--green-dark); color:#fff; border-color:var(--green-dark);}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; font-size:13px;}
  th, td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  th{background:var(--paper-2); font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em;}
  tr:hover{background:#fafcf8;}
  .badge{padding:4px 10px; border-radius:12px; font-size:11.5px; font-weight:700; display:inline-block;}
  .badge.Pending{background:#FDF0DC; color:#9A6A1E;}
  .badge.Scheduled{background:#DDEBFA; color:#1E5A9A;}
  .badge.Completed{background:#DDF3E1; color:#1E7A3C;}
  .badge.Cancelled{background:#FADDDD; color:#9A1E1E;}
  select.status-select{border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:12px; width:100%; max-width:160px;}
  .table-scroll{overflow-x:auto; border-radius:10px;}

  /* Mobile: table rows become cards. Desktop/tablet keep the real table. */
  @media (max-width: 760px){
    .toolbar{flex-direction:column; align-items:stretch;}
    #searchBox{margin-left:0 !important; width:100%;}
    table, thead, tbody, th, td, tr{display:block; width:100%;}
    thead{position:absolute; left:-9999px; top:-9999px;} /* hidden but still screen-reader accessible via data-label below */
    table{border-radius:10px;}
    tr{background:#fff; border-radius:10px; margin-bottom:12px; padding:10px 4px; box-shadow:0 1px 4px rgba(0,0,0,0.06);}
    td{border-bottom:none; padding:8px 12px; display:flex; justify-content:space-between; gap:12px; align-items:flex-start; text-align:right;}
    td::before{content:attr(data-label); font-weight:700; font-size:11px; text-transform:uppercase; color:#5a6152; text-align:left; flex-shrink:0;}
    td[data-label="Booking ID"]{border-bottom:1px solid var(--line); margin-bottom:4px; padding-bottom:10px;}
  }
  .empty, .err{text-align:center; padding:40px; color:#5a6152;}
  .err{color:#c0392b;}
  .stats{display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .stat-card{background:#fff; border-radius:10px; padding:14px 18px; min-width:110px;}
  .stat-card .n{font-size:22px; font-weight:800;}
  .stat-card .l{font-size:11.5px; color:#5a6152;}
  a{color:var(--green-dark);}
</style>
</head>
<body>

<!--
  SECURITY NOTE (Phase 1):
  This shared ADMIN_KEY is a temporary, single-password gate — not
  real per-user authentication. It's appropriate for one person (you)
  using this dashboard. Before adding staff or multiple admins, this
  needs to be replaced with real per-person logins (see `adminLogin`
  in config.js FUTURE, and Phase 4 in ROADMAP.md). Until then: don't
  share this key beyond yourself, and treat it as you would a password,
  not a convenience code.
-->
<div class="gate" id="gate">
  <h1 style="margin-bottom:6px;">Ecobin Waste Admin</h1>
  <p style="font-size:13px; color:#5a6152;">Enter your backend URL and admin key (stored in Apps Script Script Properties).</p>
  <input type="text" id="endpointInput" placeholder="Apps Script Web App URL">
  <input type="password" id="keyInput" placeholder="Admin key">
  <button onclick="loadDashboard()">Load Bookings</button>
  <p id="gateError" class="err" style="display:none; padding:10px 0;"></p>
  <p style="font-size:11.5px; color:#9A6A1E; margin-top:14px; line-height:1.5;">⚠ Phase-1 security: this is a single shared password, not individual logins. Fine for one admin (you); replace with real per-user authentication before adding staff.</p>
</div>

<div class="wrap" id="dashboard" style="display:none;">
  <header>
    <h1>📋 Bookings</h1>
    <button class="btn" onclick="refresh()">↻ Refresh</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar" id="filterBar">
    <button class="active" data-filter="All">All</button>
    <button data-filter="Pending">Pending</button>
    <button data-filter="Scheduled">Scheduled</button>
    <button data-filter="Completed">Completed</button>
    <button data-filter="Cancelled">Cancelled</button>
    <input type="text" id="searchBox" placeholder="Search name / phone / booking ID" style="margin-left:auto; padding:8px 12px; border-radius:20px; border:1px solid var(--line); font-size:12.5px; min-width:220px;">
    <button onclick="exportCSV()">⬇ Export CSV</button>
  </div>

  <div id="tableWrap"></div>
</div>

<script>
  var ENDPOINT = '';
  var ADMIN_KEY = '';
  var allBookings = [];
  var currentFilter = 'All';

  function loadDashboard(){
    ENDPOINT = document.getElementById('endpointInput').value.trim();
    ADMIN_KEY = document.getElementById('keyInput').value.trim();
    if (!ENDPOINT || !ADMIN_KEY){
      showGateError('Please enter both the backend URL and admin key.');
      return;
    }
    // Only ever send the admin key to a genuine Apps Script Web App URL —
    // guards against accidentally (or via social engineering) pasting in
    // an unrelated/malicious URL and leaking the key to it.
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(ENDPOINT)){
      showGateError('That doesn\'t look like a valid Apps Script Web App URL (should start with https://script.google.com/macros/s/... and end in /exec).');
      return;
    }
    refresh();
  }

  function showGateError(msg){
    var el = document.getElementById('gateError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function refresh(){
    try{
      var res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'list', key: ADMIN_KEY })
      });
      var data = await res.json();
      if (!data.success){
        showGateError(data.error || 'Failed to load bookings.');
        return;
      }
      allBookings = data.bookings || [];
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      renderStats();
      renderTable();
    }catch(e){
      showGateError('Could not reach the backend. Check the URL and your internet connection.');
      console.error(e);
    }
  }

  function renderStats(){
    var counts = { Pending:0, Scheduled:0, Completed:0, Cancelled:0 };
    allBookings.forEach(function(b){ if (counts[b.Status] !== undefined) counts[b.Status]++; });
    var html = '<div class="stat-card"><div class="n">' + allBookings.length + '</div><div class="l">Total Bookings</div></div>';
    Object.keys(counts).forEach(function(k){
      html += '<div class="stat-card"><div class="n">' + counts[k] + '</div><div class="l">' + k + '</div></div>';
    });
    document.getElementById('stats').innerHTML = html;
  }

  function renderTable(){
    var search = (document.getElementById('searchBox').value || '').toLowerCase();
    var rows = allBookings.filter(function(b){
      if (currentFilter !== 'All' && b.Status !== currentFilter) return false;
      if (search){
        var hay = (b['Booking ID'] + ' ' + b.Name + ' ' + b.Phone).toLowerCase();
        if (hay.indexOf(search) === -1) return false;
      }
      return true;
    });

    if (!rows.length){
      document.getElementById('tableWrap').innerHTML = '<div class="empty">No bookings match this view yet.</div>';
      return;
    }

    var html = '<div class="table-scroll"><table><thead><tr>' +
      '<th>Booking ID</th><th>Submitted</th><th>Name</th><th>Phone</th><th>Address</th><th>Area</th>' +
      '<th>Waste Type</th><th>Qty</th><th>Pickup</th><th>Photos</th><th>Status</th>' +
      '</tr></thead><tbody>';

    rows.forEach(function(b){
      var photos = (b['Photo URLs'] || '').split(',').map(function(s){return s.trim();}).filter(Boolean);
      // Defense-in-depth: only ever link http(s) URLs, even though these are
      // Code.gs-generated Drive links, not raw customer input.
      var photoLinks = photos.filter(function(u){ return /^https?:\/\//i.test(u); })
        .map(function(u,i){ return '<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener">#' + (i+1) + '</a>'; }).join(' ');
      var emailSub = b.Email ? ('<br><span style="opacity:0.6; font-size:11px;">' + escapeHtml(b.Email) + '</span>') : '';
      var bookingId = escapeHtml(b['Booking ID']);
      var statusSafe = escapeHtml(b.Status);
      html += '<tr>' +
        '<td data-label="Booking ID"><strong>' + bookingId + '</strong></td>' +
        '<td data-label="Submitted">' + formatDate(b.Timestamp) + '</td>' +
        '<td data-label="Name">' + escapeHtml(b.Name) + emailSub + '</td>' +
        '<td data-label="Phone">' + escapeHtml(b.Phone) + '</td>' +
        '<td data-label="Address" style="max-width:180px;">' + escapeHtml(b.Address) + '</td>' +
        '<td data-label="Area">' + escapeHtml(b.Area) + '</td>' +
        '<td data-label="Waste Type">' + escapeHtml(b['Waste Type']) + '</td>' +
        '<td data-label="Qty">' + escapeHtml(b.Quantity) + '</td>' +
        '<td data-label="Pickup">' + escapeHtml(b['Pickup Date']) + '<br><span style="opacity:0.6;">' + escapeHtml(b['Pickup Time']) + '</span></td>' +
        '<td data-label="Photos">' + (photoLinks || '—') + '</td>' +
        '<td data-label="Status">' +
          '<span class="badge ' + statusSafe + '">' + statusSafe + '</span><br>' +
          '<select class="status-select" data-booking-id="' + bookingId + '">' +
            ['Pending','Scheduled','Completed','Cancelled'].map(function(s){
              return '<option value="' + s + '"' + (s === b.Status ? ' selected' : '') + '>' + s + '</option>';
            }).join('') +
          '</select>' +
        '</td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById('tableWrap').innerHTML = html;
    // Wire status-change listeners here instead of inline onchange="" —
    // avoids ever building a JS string with un-sanitized data inside an HTML attribute.
    document.querySelectorAll('.status-select').forEach(function(sel){
      sel.addEventListener('change', function(){
        changeStatus(this.getAttribute('data-booking-id'), this.value);
      });
    });
  }

  async function changeStatus(bookingId, newStatus){
    try{
      var res = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'updateStatus', payload: { bookingId: bookingId, status: newStatus, key: ADMIN_KEY } })
      });
      var data = await res.json();
      if (!data.success){ alert('Update failed: ' + data.error); return; }
      allBookings.forEach(function(b){ if (b['Booking ID'] === bookingId) b.Status = newStatus; });
      renderStats(); renderTable();
    }catch(e){ alert('Could not update status. Check your connection.'); }
  }

  function formatDate(ts){
    try{ return new Date(ts).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch(e){ return ts; }
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  document.getElementById('filterBar').addEventListener('click', function(e){
    if (e.target.tagName !== 'BUTTON' || !e.target.dataset.filter) return;
    document.querySelectorAll('#filterBar button[data-filter]').forEach(function(b){ b.classList.remove('active'); });
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    renderTable();
  });
  document.getElementById('searchBox').addEventListener('input', renderTable);

  function exportCSV(){
    if (!allBookings.length) return;
    var headers = Object.keys(allBookings[0]);
    var rows = [headers.join(',')].concat(allBookings.map(function(b){
      return headers.map(function(h){ return '"' + String(b[h] == null ? '' : b[h]).replace(/"/g,'""') + '"'; }).join(',');
    }));
    var blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'ecobin-bookings.csv'; a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
